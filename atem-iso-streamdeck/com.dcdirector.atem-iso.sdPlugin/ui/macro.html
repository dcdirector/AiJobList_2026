<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Macro</title>
		<script src="sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Macro number">
			<sdpi-textfield setting="macro" placeholder="1" default="1" pattern="[0-9]*" maxlength="3"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Button label">
			<sdpi-textfield setting="label" placeholder="Leave blank to use the macro name" maxlength="12"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="ATEM IP address">
			<sdpi-textfield global setting="host" placeholder="192.168.10.240"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item>
			<small>One address for every button. Find it in ATEM Software Control under Switcher Settings, or in ATEM Setup.</small>
		</sdpi-item>
	</body>
</html>
